<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f3f6;
}

.container {
  max-width: 500px;
  margin: 40px auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 5px 20px #0002;
}

.login {
  padding: 25px;
}

h1, h2 {
  text-align: center;
}

input {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 0;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

#error {
  color: red;
  text-align: center;
}

#chat {
  display: none;
}

.header {
  padding: 15px;
  background: #222;
  color: white;
}

.header h2 {
  margin: 0;
}

#messages {
  height: 400px;
  overflow-y: auto;
  padding: 15px;
}

.message {
  background: #eeeeee;
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
}

.user1 {
  background: #d8f5d0;
  text-align: right;
}

.chat-input {
  padding: 10px;
  border-top: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="login" id="loginBox">

    <h1>Private Chat</h1>

    <input
      id="username"
      type="text"
      placeholder="User 1 or User 2"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <p id="error"></p>

  </div>


  <!-- CHAT -->
  <div id="chat">

    <div class="header">
      <h2>Private Chat</h2>
      <div id="loggedUser"></div>
    </div>

    <div id="messages"></div>

    <div class="chat-input">

      <input
        id="messageInput"
        type="text"
        placeholder="Message likho..."
        onkeydown="if(event.key==='Enter') sendMessage()"
      >

      <button onclick="sendMessage()">Send</button>

      <button onclick="logout()">Logout</button>

    </div>

  </div>

</div>


<script>

let currentUser = "";


// LOGIN
function login() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  // USER 1
  if (username === "User1" && password === "3031") {

    currentUser = "User1";

  }

  // USER 2
  else if (username === "User2" && password === "2601") {

    currentUser = "User2";

  }

  else {

    document.getElementById("error").innerText =
      "Wrong User ID or Password";

    return;
  }


  document.getElementById("loginBox").style.display = "none";

  document.getElementById("chat").style.display = "block";

  document.getElementById("loggedUser").innerText =
    "Logged in as: " + currentUser;

  document.getElementById("error").innerText = "";

  loadMessages();
}


// SEND MESSAGE
function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text = input.value.trim();

  if (text === "") return;


  const messages =
    JSON.parse(localStorage.getItem("chatMessages") || "[]");


  messages.push({

    user: currentUser,

    text: text

  });


  localStorage.setItem(
    "chatMessages",
    JSON.stringify(messages)
  );


  input.value = "";

  loadMessages();
}


// LOAD MESSAGES
function loadMessages() {

  const messages =
    JSON.parse(localStorage.getItem("chatMessages") || "[]");

  const box =
    document.getElementById("messages");

  box.innerHTML = "";


  messages.forEach(message => {

    const div =
      document.createElement("div");

    div.className = "message";


    if (message.user === currentUser) {

      div.classList.add("user1");

    }


    div.innerHTML =
      "<b>" +
      message.user +
      "</b><br>" +
      escapeHTML(message.text);


    box.appendChild(div);

  });


  box.scrollTop = box.scrollHeight;
}


// BASIC TEXT SAFETY
function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// LOGOUT
function logout() {

  currentUser = "";

  document.getElementById("chat").style.display = "none";

  document.getElementById("loginBox").style.display = "block";

  document.getElementById("username").value = "";

  document.getElementById("password").value = "";

  document.getElementById("messages").innerHTML = "";
}

</script>

</body>
</html>
